<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    .order-id { font-size: 20px; font-weight: 700; margin-top: 16px; }
    .status { color: #555; margin-top: 8px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <p>Product A &times; 1</p>

  <button id="place-order">Place order</button>

  <div id="order-id" class="order-id"></div>
  <div id="status" class="status"></div>

  <script>
    // Let the tests force the failure modes via ?simulate=missing|mismatch
    const params = new URLSearchParams(window.location.search);
    const simulate = params.get("simulate");
    const url = "/orders" + (simulate ? "?simulate=" + encodeURIComponent(simulate) : "");

    document.getElementById("place-order").addEventListener("click", async () => {
      document.getElementById("status").textContent = "Placing order...";
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item: "Product A", qty: 1 }),
        });
        const data = await res.json();
        document.getElementById("order-id").textContent = "Order ID: " + data.orderId;
        document.getElementById("status").textContent = "Order placed";
      } catch (e) {
        document.getElementById("status").className = "status error";
        document.getElementById("status").textContent = "Failed to place order";
      }
    });
  </script>
</body>
</html>
